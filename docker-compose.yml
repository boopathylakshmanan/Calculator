services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: calculator
      POSTGRES_PASSWORD: calculator
      POSTGRES_DB: calculator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculator -d calculator"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - calculator_net

networks:
  calculator_net:
    name: calculator_net

volumes:
  pgdata:
